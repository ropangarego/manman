name: Playwright Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke:
    name: Auth, study, progress smoke
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      MANMAN_E2E_EMAIL: ${{ secrets.MANMAN_E2E_EMAIL }}
      MANMAN_E2E_PASSWORD: ${{ secrets.MANMAN_E2E_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/manman-preview.log 2>&1 &

      - name: Wait for preview
        run: |
          for attempt in {1..60}; do
            if curl -sf http://127.0.0.1:4173 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Preview server did not start"
          cat /tmp/manman-preview.log
          exit 1

      - name: Run Playwright smoke tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-artifacts
          path: |
            playwright-report
            test-results
            /tmp/manman-preview.log
          if-no-files-found: ignore
