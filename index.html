<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>Manman!</title>
    <script>
      try {
        var rawPreferences = localStorage.getItem('mandarin-app-preferences');
        var prefersDark = false;

        if (rawPreferences) {
          var preferences = JSON.parse(rawPreferences);
          prefersDark = preferences && preferences.version === 2 && preferences.state && preferences.state.settings && preferences.state.settings.dark === true;
        } else {
          prefersDark = localStorage.getItem('mandarin-theme') === 'dark';
        }

        if (prefersDark) {
          document.documentElement.classList.add('dark');
        }
      } catch {
        // Keep the app usable if storage is unavailable or malformed.
      }
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111827'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='34' fill='white'%3E%E6%B1%89%3C/text%3E%3C/svg%3E"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Serif+SC:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
